[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "archguard"
version = "0.1.0"
description = "Visual architecture linter and conformance engine"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
live = ["google-genai>=1.0.0"]
dev = ["pytest>=7"]

[project.scripts]
archguard = "archguard.cli:main"

[tool.setuptools.packages.find]
include = ["archguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
